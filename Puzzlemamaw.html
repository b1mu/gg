<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Puzzlemamaw</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--w1:#8a5a33;--w2:#6e4526;--w3:#4a2d17;--panel:#f6ead2;--ink:#3a2616;--muted:#7b6249;--ivory:#fff8e6;--edge:#cdb98b;--glow:#ffb43a;--cell:#ecdcb8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--w1:#5c3a20;--w2:#472b16;--w3:#2e1a0c;--panel:#e9d9b8;--cell:#dcc99f}}
:root[data-theme="dark"]{--w1:#5c3a20;--w2:#472b16;--w3:#2e1a0c;--panel:#e9d9b8;--cell:#dcc99f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
body{margin:0;font:17px/1.5 "Lora",Georgia,serif;color:var(--ink);background-color:var(--w1);
background-image:repeating-linear-gradient(90deg,transparent 0 118px,rgba(0,0,0,.28) 118px 120px),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px),linear-gradient(180deg,var(--w1),var(--w2));min-height:100vh}
body.big{font-size:21px}
.app{max-width:520px;margin:0 auto;padding:0 12px 30px}
.lights{display:flex;justify-content:space-around;border-top:3px solid var(--w3);margin:0 -12px}
.lights i{width:11px;height:16px;border-radius:50% 50% 50% 50%/35% 35% 65% 65%;background:var(--c);box-shadow:0 0 14px 5px var(--c);animation:tw 3.2s ease-in-out infinite;animation-delay:var(--d)}
.lights i:nth-child(odd){margin-top:7px}
.nolight .lights i{animation:none;box-shadow:none;opacity:.6}
@keyframes tw{50%{opacity:.45;box-shadow:0 0 6px 2px var(--c)}}
header{text-align:center;padding:16px 0 8px}
h1{margin:0;font-size:38px;color:#ffe2a3;text-shadow:0 2px 0 var(--w3),0 0 22px var(--glow);letter-spacing:1px}
.nolight h1{text-shadow:0 2px 0 var(--w3)}
header p{margin:2px 0 0;color:#f0d9b0;font-style:italic}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 10px;scrollbar-width:none}
nav button{flex:1 0 auto;font:700 15px "Lora",Georgia,serif;color:#f6e3bd;padding:10px 14px;border:2px solid var(--w3);border-radius:12px 12px 4px 4px;cursor:pointer;background:linear-gradient(180deg,var(--w2),var(--w3));box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
nav button.on{background:linear-gradient(180deg,#f3d08a,#d9a554);color:var(--w3);box-shadow:0 0 18px var(--glow)}
.nolight nav button.on{box-shadow:none}
.panel{background:var(--panel);border:7px solid var(--w3);border-radius:18px;padding:18px;box-shadow:inset 0 0 30px rgba(120,80,30,.25),0 10px 30px rgba(0,0,0,.45)}
h2{margin:0 0 8px;font-size:26px}
p{margin:0 0 12px}
.btn{font:700 19px "Lora",Georgia,serif;color:#fff6df;border:2px solid var(--w3);border-radius:14px;padding:14px 22px;cursor:pointer;background:linear-gradient(180deg,#b9763c,#8a4f24);box-shadow:0 4px 0 var(--w3),0 0 20px rgba(255,180,58,.45)}
.nolight .btn{box-shadow:0 4px 0 var(--w3)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--w3)}
.btn.sm{font-size:15px;padding:8px 14px}.btn.alt{background:linear-gradient(180deg,#e3cf9f,#c9b07a);color:var(--w3);box-shadow:0 4px 0 var(--w3)}
.btn.wide{display:block;width:100%;margin:10px 0}
.gc{display:flex;gap:14px;align-items:center;background:var(--cell);border-radius:14px;padding:12px;margin-bottom:12px;border:2px solid var(--edge)}
.gc svg{width:64px;height:64px;flex:none;background:var(--ivory);border-radius:12px;padding:6px}
.gc div{flex:1}.gc b{font-size:20px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.bar span{font-weight:700}
.bd{position:relative;width:100%;aspect-ratio:12/8;background:radial-gradient(circle,#2f6b4a,#1f4a33);border-radius:14px;border:4px solid var(--w3);box-shadow:inset 0 0 40px rgba(0,0,0,.5);margin:6px 0 10px}
.t{position:absolute;width:16.667%;height:25%;padding:0;border:0;border-radius:9px;background:linear-gradient(145deg,#fffdf2,var(--ivory));box-shadow:3px 4px 0 var(--edge),5px 8px 10px rgba(0,0,0,.45);cursor:pointer;transition:filter .2s}
.t svg{width:86%;height:86%;display:block;margin:7%;pointer-events:none}
.t.lock{filter:brightness(.62) saturate(.7);cursor:default}
.t.sel{box-shadow:0 0 0 3px #ffd36b,0 0 26px 6px var(--glow);transform:translate(-2px,-3px)}
.t.hint{animation:hn .6s ease-in-out 3}
.t.van{animation:vn .38s ease-in forwards}
@keyframes hn{50%{box-shadow:0 0 0 3px #fff,0 0 30px 10px #7dffb0}}
@keyframes vn{40%{box-shadow:0 0 40px 14px #ffe08a;filter:brightness(1.3)}to{transform:scale(.2);opacity:0}}
.mem{display:grid;gap:10px}
.card{aspect-ratio:1;border:3px solid var(--w3);border-radius:14px;cursor:pointer;padding:0;background:radial-gradient(circle at 50% 40%,#c68a4f,var(--w2));position:relative;box-shadow:0 4px 0 var(--w3),inset 0 0 14px rgba(0,0,0,.35)}
.card::after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:#ffd98a;text-shadow:0 0 14px var(--glow)}
.card .f{display:none}
.card.up,.card.ok{background:linear-gradient(145deg,#fffdf2,var(--ivory));animation:pp .25s}
.card.up::after,.card.ok::after{display:none}.card.up .f,.card.ok .f{display:block}
.card.ok{box-shadow:0 0 0 3px #7dffb0,0 0 20px #7dffb0}
.card svg{width:78%;height:78%;margin:11%}
@keyframes pp{from{transform:scale(.85)}}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcd{aspect-ratio:3/2;border-radius:8px;border:6px solid #fffaf0;box-shadow:0 5px 12px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;font-weight:700;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.6);padding:4px}
.pcd svg{width:42px;height:42px;margin-bottom:2px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.pcd.l{filter:grayscale(1) brightness(.55)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--edge)}
.tg{min-width:120px}
#modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(30,15,5,.65);z-index:50;padding:20px}
#modal.on{display:grid}
#modal .panel{max-width:400px;text-align:center}
.stat{margin-top:14px;color:var(--muted);text-align:center}
.pl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px}
.say{display:flex;gap:12px;background:var(--cell);border:2px solid var(--edge);border-radius:14px;padding:14px;min-height:170px;align-items:flex-start}
.say svg{width:84px;height:84px;flex:none;border-radius:50%;border:3px solid var(--w3);box-shadow:0 0 16px var(--glow)}
.say p{margin:4px 0 0}
.stage{position:relative;aspect-ratio:300/190;border-radius:14px;border:4px solid var(--w3);overflow:hidden;box-shadow:inset 0 0 30px rgba(0,0,0,.4),0 0 24px rgba(255,180,58,.3);animation:fi .6s}
.stage .bg{position:absolute;inset:0;width:100%;height:100%}
.fg{position:absolute;bottom:-3%;width:27%;transform:translateX(-50%);transition:filter .25s;filter:brightness(.55) saturate(.7)}
.fg svg{width:100%;display:block}
.fg.on{filter:drop-shadow(0 0 10px #ffd36b);z-index:2;animation:bob .7s ease-in-out infinite alternate}
.stage.first .fg{animation:en .8s ease-out both}
.ttl{position:absolute;top:8px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:19px;text-shadow:0 2px 8px #000;animation:tt 3.2s forwards;pointer-events:none;z-index:5}
.say2{background:var(--cell);border:2px solid var(--edge);border-radius:14px;padding:12px 14px;margin-top:12px;min-height:118px}
.nm{display:inline-block;font-weight:700;background:var(--w2);color:#ffe2a3;border-radius:8px;padding:1px 12px;font-size:14px;margin-bottom:4px}
.say2 p{margin:0}.say2.nr p{font-style:italic}
@keyframes fi{from{opacity:0}}
body.huge{font-size:25px}
.calm *{animation:none!important;transition:none!important}
body.hc{--panel:#fffdf6;--ink:#000;--muted:#2b2b2b;--cell:#f1e7cc}
body.honey{--w1:#b57a43;--w2:#9a6232;--w3:#6a4020}
body.mid{--w1:#2f2740;--w2:#231c30;--w3:#120e19}
@keyframes en{from{transform:translate(-50%,45%);opacity:0}}
@keyframes bob{from{transform:translateX(-50%)}to{transform:translateX(-50%) translateY(-7px)}}
@keyframes tt{0%{opacity:0}15%,70%{opacity:1}100%{opacity:0}}
.cast{display:flex;gap:8px;margin:8px 0 14px}.cast svg{width:58px;height:58px;border-radius:50%;border:3px solid var(--w3);box-shadow:0 0 12px var(--glow)}
.fr{width:70%;aspect-ratio:4/3;margin:14px auto;border:10px solid #c9a24a;border-radius:4px;box-shadow:0 0 26px var(--glow),inset 0 0 20px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div class="app">
 <div class="lights" id="lights"></div>
 <header><h1>Puzzlemamaw</h1><p>A cozy afternoon in California</p></header>
 <nav id="tabs"></nav>
 <main class="panel" id="main"></main>
</div>
<div id="modal"><div class="panel" id="mbox"></div></div>
<script>
const $=s=>document.querySelector(s),main=$("#main");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let S={glow:1,big:0,easy:1,wins:0,ch:0,music:1,vol:1,sfx:1,voice:0,speed:1,len:1,calm:0,hc:0,wood:0,flip:0,hint:1,fr:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("pmm")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("pmm",JSON.stringify(S))}catch(e){}};
const applySet=()=>{const c=document.body.classList;c.toggle("nolight",!S.glow);c.toggle("big",S.big===1);c.toggle("huge",S.big===2);c.toggle("calm",!!S.calm);c.toggle("hc",!!S.hc);c.toggle("honey",S.wood===1);c.toggle("mid",S.wood===2);try{MX.update();if(!S.music)MX.stop();else MX.play(MX.want||"menu")}catch(e){}};

const pet=(c,n,rx,ry,o)=>Array.from({length:n},(_,i)=>`<ellipse cx="20" cy="${o}" rx="${rx}" ry="${ry}" fill="${c}" transform="rotate(${i*360/n} 20 20)"/>`).join("");
const ICON=[
pet("#f7931e",6,5.5,8,10)+pet("#ffb347",6,3,5,12)+'<circle cx="20" cy="20" r="4" fill="#7a3b0a"/>',
'<circle cx="20" cy="21" r="14" fill="#f58a1f"/><circle cx="20" cy="21" r="10" fill="#ffa63d" opacity=".7"/><circle cx="20" cy="21" r="2" fill="#7a4a10"/><ellipse cx="25" cy="8" rx="6" ry="3" fill="#4f9d3a" transform="rotate(-25 25 8)"/>',
'<circle cx="20" cy="20" r="16" fill="#1f5e3a"/><circle cx="20" cy="20" r="11" fill="#2c7a4b"/><circle cx="20" cy="20" r="6" fill="#4aa066"/><circle cx="20" cy="20" r="2" fill="#7a5230"/>',
'<circle cx="20" cy="20" r="16" fill="#2f9ad0"/><path d="M8 16q6-6 12 0t12 0M8 24q6-6 12 0t12 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>',
Array.from({length:10},(_,i)=>`<rect x="18.5" y="2" width="3" height="7" rx="1.5" fill="#ffc82e" transform="rotate(${i*36} 20 20)"/>`).join("")+'<circle cx="20" cy="20" r="10" fill="#ffd84a"/><circle cx="20" cy="20" r="6" fill="#ffe98a"/>',
'<ellipse cx="20" cy="21" rx="12" ry="16" fill="#3e6b2a"/><ellipse cx="20" cy="21" rx="9.5" ry="13.5" fill="#bfd96b"/><circle cx="20" cy="24" r="6" fill="#7a4a24"/>',
pet("#3f9b4b",7,3.5,10,10)+'<circle cx="20" cy="20" r="4" fill="#7a4a24"/>',
'<g fill="#7a3c8c"><circle cx="13" cy="16" r="5"/><circle cx="23" cy="16" r="5"/><circle cx="18" cy="24" r="5"/><circle cx="28" cy="24" r="5"/><circle cx="23" cy="32" r="5"/></g><ellipse cx="22" cy="7" rx="6" ry="3" fill="#4f9d3a"/>',
'<polygon points="20,3 25,15 37,16 28,24 31,36 20,29 9,36 12,24 3,16 15,15" fill="#f0733c"/><circle cx="20" cy="20" r="3" fill="#ffd0a8"/>',
'<path d="M2 31Q11 8 20 29Q29 8 38 31" fill="none" stroke="#c0392b" stroke-width="2.4"/><rect x="8" y="9" width="5" height="26" fill="#c0392b"/><rect x="27" y="9" width="5" height="26" fill="#c0392b"/><rect x="2" y="29" width="36" height="3" fill="#7a4a24"/>',
'<rect x="15" y="9" width="10" height="27" rx="5" fill="#4f9d3a"/><rect x="6" y="16" width="7" height="14" rx="3.5" fill="#4f9d3a"/><rect x="27" y="13" width="7" height="14" rx="3.5" fill="#4f9d3a"/><circle cx="20" cy="9" r="3.5" fill="#ff7aa8"/>',
'<path d="M20 35L4 16A18 18 0 0 1 36 16Z" fill="#f6b8a2"/><path d="M20 35L10 12M20 35V9M20 35L30 12" stroke="#d98a73" stroke-width="2" fill="none"/>'];
const icon=t=>`<svg viewBox="0 0 40 40">${ICON[t]}</svg>`;

const CARDS=[["Poppy Fields","#e8872b","#f6c244",0],["Redwood Forest","#1f5e3a","#4aa066",2],["Pacific Coast","#2f7fb0","#7fd0e8",3],["Napa Valley","#6b3a7c","#c58ad6",7],["Joshua Tree","#c9703a","#f0c27a",10],["Golden Gate","#b8402f","#f08a6a",9]];

// tabs
const TABS=[["home","Home"],["story","Story"],["crew","Crew"],["games","Games"],["how","How to Play"],["cards","Postcards"],["set","Settings"]];
$("#tabs").innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join("");
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.t)};
$("#lights").innerHTML=Array.from({length:15},(_,i)=>`<i style="--c:${["#ffb43a","#ff7a6a","#8be0a0","#7fc8ff","#ffe27a"][i%5]};--d:${(i*.37%3).toFixed(2)}s"></i>`).join("");

function go(t){
 MX.play("menu");speak("","");tiles=null;story=null;
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
 const P={
 crew:crewList(),
 story:`<h2>Penny’s Adventures</h2><p>Three long chapters, ten episodes each. Finish one to open the next.</p><div class="cast">${["penny","gus","mari","baron","vivi"].map(face).join("")}</div>${bookList()}${[].map((c,i)=>`<div class="gc"><div><b>${i+1}. ${c.t}</b><br>${i<S.ch?"✔ "+c.pr:i===S.ch?"Ready to play":"🔒 Locked"}<br>${i<=S.ch?`<button class="btn sm" data-c="${i}">${i<S.ch?"Replay":"Begin"}</button>`:""}</div></div>`).join("")}`,
 home:`<h2>Welcome, friend</h2><p>Pull up a chair. Puzzlemamaw is a slow, gentle game of matching pictures from the sunny Golden State. There is no timer and no way to lose.</p><button class="btn wide" data-a="story">Continue the Story</button><button class="btn alt wide" data-a="tiles">Quick Tile Pairs</button><button class="btn alt wide" data-a="memory">Try Memory Match</button><div class="stat">Games won: ${S.wins} · Postcards: ${Math.min(6,S.wins)} of 6</div>`,
 games:`<h2>Choose a game</h2><div class="gc">${icon(4)}<div><b>Tile Pairs</b><br>Clear the stacked tiles by matching free pairs.<br><button class="btn sm" data-a="tiles">Play</button></div></div><div class="gc">${icon(0)}<div><b>Memory Match</b><br>Flip cards and find the matching pictures.<br><button class="btn sm" data-a="memory">Play</button></div></div>`,
 how:`<h2>How to play</h2><p><b>Tile Pairs:</b> Tap two tiles with the same picture to remove them. A tile can only be picked if nothing sits on top of it and its left or right side is open. Dim tiles are stuck for now. Tap <i>Hint</i> if you want a nudge.</p><p><b>Memory Match:</b> Tap a card to turn it over, then tap a second one. If they match, they stay face up. Find them all to finish.</p><p>Every win earns a California postcard for your collection.</p>`,
 cards:`<h2>Your postcards</h2><p>Win a game to collect each one.</p><div class="pc">${CARDS.map((c,i)=>{const u=i<S.wins;return `<div class="pcd ${u?'':'l'}" style="background:linear-gradient(135deg,${c[1]},${c[2]})">${u?icon(c[3]):'🔒'}${u?c[0]:'Locked'}</div>`}).join("")}</div>`,
 set:setPage(),old:`<h2>Settings</h2>
 <div class="row"><span>Glowing lights</span><button class="btn sm tg" data-s="glow">${S.glow?"On":"Off"}</button></div>
 <div class="row"><span>Text size</span><button class="btn sm tg" data-s="big">${S.big?"Large":"Normal"}</button></div>
 <div class="row"><span>Memory Match size</span><button class="btn sm tg" data-s="easy">${S.easy?"Easy (12)":"Normal (20)"}</button></div>
 <div class="row"><span>Start over</span><button class="btn sm alt tg" data-s="reset">Reset</button></div>`};
 main.innerHTML=P[t];
}
main.onclick=e=>{
 const a=e.target.closest("[data-a]"),s=e.target.closest("[data-s]");
 if(a){({tiles:tilePairs,memory:memory,story:()=>go("story"),crew:()=>go("crew"),games:()=>go("games")})[a.dataset.a]()}
 const ch=e.target.closest("[data-c]");if(ch)startCh(+ch.dataset.c);
 const bk=e.target.closest("[data-b]");if(bk)bookView(+bk.dataset.b);
 const wk=e.target.closest("[data-w]");if(wk)chat(wk.dataset.w);
 const q=e.target.closest("[data-q]");if(q){const[k,j]=q.dataset.q.split(":");S.fr[k]=Math.min(10,(S.fr[k]|0)+1);save();chat(k,TALK[k][+j]);speak(TALK[k][+j],k)}
 if(s){const k=s.dataset.s;if(k==="reset"){if(confirm("Erase your wins, postcards and story?")){S.wins=0;S.ch=0}}else S[k]=((S[k]|0)+1)%OPTS[k][1].length;save();applySet();go("set")}
};

// ---------- Tile Pairs ----------
let tiles=null,sel=null,busy=false,story=null;
const POS=[];
for(let y=0;y<8;y+=2)for(let x=0;x<12;x+=2)POS.push({x,y,z:0});
for(let y=2;y<6;y+=2)for(let x=2;x<10;x+=2)POS.push({x,y,z:1});
for(let y=2;y<6;y+=2)for(let x=4;x<8;x+=2)POS.push({x,y,z:2});
const side=(t,d)=>tiles.some(o=>!o.gone&&o.z===t.z&&o.x===t.x+d&&Math.abs(o.y-t.y)<2);
const free=t=>!tiles.some(o=>!o.gone&&o.z===t.z+1&&Math.abs(o.x-t.x)<2&&Math.abs(o.y-t.y)<2)&&(!side(t,-2)||!side(t,2));
function deal(list){
 for(let n=0;n<300;n++){
  list.forEach(t=>t.gone=false);
  const types=sh(Array.from({length:list.length/2},(_,i)=>i%12));let ok=true;
  for(let k=0;k<list.length/2;k++){
   const fr=list.filter(t=>!t.gone&&free(t));
   if(fr.length<2){ok=false;break}
   const f=sh(fr),s=types.pop();f[0].s=f[1].s=s;f[0].gone=f[1].gone=true;
  }
  if(ok){list.forEach(t=>t.gone=false);return}
 }
}
function tilePairs(){if(!story)MX.play("puz");
 tiles=(story&&story.lay?POS.filter(story.lay):POS).map(p=>({...p,gone:false}));deal(tiles);sel=null;busy=false;
 main.innerHTML=`<div class="bar"><button class="btn sm alt" data-a="games">← Back</button><span id="left"></span>${S.hint?'<button class="btn sm" id="hint">Hint</button>':"<span></span>"}</div><div class="bd" id="bd"></div><div class="bar"><button class="btn sm alt" id="shuf">Shuffle</button><span id="tmsg"></span></div>`;
 drawT();
 $("#bd").onclick=async e=>{
  const b=e.target.closest(".t");if(!b||busy)return;
  const t=tiles[+b.dataset.k];if(!free(t))return;
  if(!sel){sel=t;MX.sfx("pick")}else if(sel===t){sel=null}
  else if(sel.s===t.s){
   busy=true;const a=sel;sel=null;drawT();MX.sfx("ok");
   document.querySelectorAll(".t").forEach(x=>{if(tiles[+x.dataset.k]===a||x===b)x.classList.add("van")});
   await wait(400);a.gone=t.gone=true;busy=false;drawT();checkT();return;
  }else sel=t;
  drawT();
 };
 if($("#hint"))$("#hint").onclick=()=>{const h=findPair();if(!h)return;document.querySelectorAll(".t").forEach(x=>{if(h.includes(tiles[+x.dataset.k]))x.classList.add("hint")})};
 $("#shuf").onclick=()=>{const l=tiles.filter(t=>!t.gone);deal(l);sel=null;drawT();$("#tmsg").textContent="Mixed up!"};
}
function findPair(){const f=tiles.filter(t=>!t.gone&&free(t));for(let i=0;i<f.length;i++)for(let j=i+1;j<f.length;j++)if(f[i].s===f[j].s)return[f[i],f[j]];return null}
function drawT(){
 const live=tiles.map((t,k)=>[t,k]).filter(a=>!a[0].gone).sort((a,b)=>a[0].z-b[0].z||a[0].y-b[0].y||a[0].x-b[0].x);
 $("#bd").innerHTML=live.map(([t,k])=>`<button class="t ${free(t)?'':'lock'} ${sel===t?'sel':''}" data-k="${k}" style="left:${t.x/12*100}%;top:${t.y/8*100}%;z-index:${t.z*10+(t.y>>1)};margin:${-t.z*5}px 0 0 ${-t.z*5}px">${icon(t.s)}</button>`).join("");
 $("#left").textContent=`Pairs left: ${live.length/2}`;
}
function checkT(){
 const live=tiles.filter(t=>!t.gone);
 if(!live.length)return win();
 if(!findPair()){deal(live);$("#tmsg").textContent="No pairs left, so I shuffled for you.";drawT()}
 else $("#tmsg").textContent="";
}

function memory(){if(!story)MX.play("puz");
 const n=story?story.n:S.easy?6:10,cols=n<=6?3:4,cs=sh(sh(Array.from({length:12},(_,i)=>i)).slice(0,n).flatMap(x=>[x,x]));
 tiles=null;let open=[],lock=false,found=0,moves=0;
 main.innerHTML=`<div class="bar"><button class="btn sm alt" data-a="games">← Back</button><span id="mv">Moves: 0</span></div><div class="mem" style="grid-template-columns:repeat(${cols},1fr)">${cs.map((c,i)=>`<button class="card" data-i="${i}"><span class="f">${icon(c)}</span></button>`).join("")}</div>`;
 main.querySelector(".mem").onclick=async e=>{
  const b=e.target.closest(".card");if(!b||lock||b.classList.contains("up")||b.classList.contains("ok"))return;
  b.classList.add("up");open.push(b);MX.sfx("pick");
  if(open.length<2)return;
  moves++;$("#mv").textContent="Moves: "+moves;lock=true;await wait(FLIP[S.flip|0]);
  const[x,y]=open;
  if(cs[+x.dataset.i]===cs[+y.dataset.i]){x.className=y.className="card ok";found++;MX.sfx("ok")}
  else{x.classList.remove("up");y.classList.remove("up")}
  open=[];lock=false;
  if(found===n){await wait(500);win(moves)}
 };
}

function win(m){MX.sfx("win");
 if(story){const rounds=1+(S.len|0);if(++story.r<rounds)return inter();S.wins++;S.ch=Math.max(S.ch,story.i+1);save();return ask(()=>scene(story,story.out,0,prize))}
 S.wins++;save();const c=CARDS[Math.min(S.wins,6)-1];
 $("#mbox").innerHTML=`<h2>Wonderful!</h2><p>${m?`You finished in ${m} moves.`:"You cleared every tile."}</p><div class="pcd" style="background:linear-gradient(135deg,${c[1]},${c[2]});margin:0 auto 14px;max-width:240px">${icon(c[3])}${c[0]}</div><button class="btn wide" id="again">Play again</button><button class="btn alt wide" id="tomenu">Back to menu</button>`;
 $("#modal").classList.add("on");
 const wasT=!!tiles;
 $("#again").onclick=()=>{$("#modal").classList.remove("on");wasT?tilePairs():memory()};

}

  this.t=setInterval(()=>{if(!S.music||this.c.state!=="running")return;const now=this.c.currentTime+.05,ch=M.ch[this.bar%M.ch.length];
   if(!this.s){ch.slice(0,3).forEach(m=>this.note(m,now,dt*8,"sine",.07,.8));this.note(ch[0]-12,now,dt*7,"sine",.12,.05)}
   if(Math.random()<M.den)this.note(ch[P[this.s]]+12,now,1.1,M.tp,.09,.01);
   this.s=(this.s+1)%8;if(!this.s)this.bar++},dt*1000)},
 stop(){clearInterval(this.t);this.t=null;this.mood=null},
 sfx(k){if(!S.sfx||!this.ensure())return;const t=this.c.currentTime,o=this.sg,n=(m,d,i)=>this.note(m,t+d,.5,"triangle",.2,.01,o);({pick:()=>n(84,0),ok:()=>{n(79,0);n(84,.1);n(88,.2)},win:()=>[72,76,79,84,88].forEach((m,i)=>n(m,i*.14))})[k]()}};

 const S={

function scene(c,L,i,done){
 const[w,t]=L[i];
 if(i===0||!$("#stg")){
  const cast=[...new Set([...c.intro,...c.out].map(x=>x[0]).filter(k=>k!=="n"))].slice(0,4);
