<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Hub</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#0c1220;color:#fff}
body{min-height:100vh;background:radial-gradient(circle at 15% 10%,#263d67 0,transparent 35%),radial-gradient(circle at 90% 90%,#4b2859 0,transparent 32%),#0c1220}
#home{min-height:100vh;padding:48px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-size:clamp(32px,6vw,56px);margin:0 0 10px;text-align:center}
.subtitle{color:#b8c5dc;margin:0 0 34px;text-align:center}
.games{width:min(900px,100%);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{min-height:270px;border:1px solid #ffffff25;border-radius:22px;padding:26px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 18px 50px #0005;overflow:hidden}
.zombie{background:linear-gradient(155deg,#174d45,#122a35 65%,#101c29)}
.puzzle{background:linear-gradient(155deg,#72523c,#3f3545 65%,#202238)}
.tag{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#d7e2f5}
.card h2{font-size:30px;margin:9px 0}
.card p{color:#e0e6f0;line-height:1.5;margin:0 0 20px}
button{border:0;border-radius:11px;padding:13px 17px;font-size:15px;font-weight:700;cursor:pointer}
.play{background:#fff;color:#182238;align-self:flex-start}
#player{display:none;position:fixed;inset:0;background:#080b12}
#bar{height:50px;display:flex;align-items:center;gap:10px;padding:6px 10px;background:#101827}
#bar button{padding:8px 12px;background:#2a3b58;color:#fff}
#bar #fullscreen{margin-left:auto;background:#416fe0}
#gameTitle{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe{display:block;width:100%;height:calc(100dvh - 50px);border:0;background:#111}
#player:fullscreen iframe{height:calc(100vh - 50px)}
@media(max-width:650px){.games{grid-template-columns:1fr}.card{min-height:230px}#bar{gap:6px}#bar button{padding:8px;font-size:12px}}
</style>
</head>
<body>
<main id="home">
  <h1>Game Hub</h1>
  <p class="subtitle">Choose a game to play.</p>
  <section class="games">
    <article class="card zombie">
      <span class="tag">Survival</span>
      <h2>Zombie Pappa</h2>
      <p>Jump into Zombie Pappa.</p>
      <button class="play" id="playZombie">Play Zombie Pappa</button>
    </article>
    <article class="card puzzle">
      <span class="tag">Puzzle</span>
      <h2>Puzzlemamaw</h2>
      <p>Play Puzzlemamaw.</p>
      <button class="play" id="playPuzzle">Play Puzzlemamaw</button>
    </article>
  </section>
</main>
<section id="player" aria-label="Game player">
  <div id="bar">
    <button id="back">← Hub</button>
    <span id="gameTitle"></span>
    <button id="fullscreen">⛶ Fullscreen</button>
  </div>
  <iframe id="gameFrame" title="Selected game" allow="autoplay; fullscreen; gamepad"></iframe>
</section>
<script>
const home=document.getElementById('home');
const player=document.getElementById('player');
const frame=document.getElementById('gameFrame');
const title=document.getElementById('gameTitle');
const games={
  zombie:{name:'Zombie Pappa',file:'Zombie Pappa.html'},
  puzzle:{name:'Puzzlemamaw',file:'puzzlemamaw.html'}
};
function launch(key){
  const game=games[key];
  if(!game)return;
  title.textContent=game.name;
  home.style.display='none';
  player.style.display='block';
  frame.src=game.file;
}
function goHome(){
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  frame.src='about:blank';
  player.style.display='none';
  home.style.display='flex';
}
async function toggleFullscreen(){
  try{
    if(document.fullscreenElement) await document.exitFullscreen();
    else await player.requestFullscreen();
  }catch(e){}
  document.getElementById('fullscreen').textContent=
    document.fullscreenElement?'⛶ Exit Fullscreen':'⛶ Fullscreen';
}
document.addEventListener('fullscreenchange',()=>{
  document.getElementById('fullscreen').textContent=
    document.fullscreenElement?'⛶ Exit Fullscreen':'⛶ Fullscreen';
});
document.getElementById('playZombie').addEventListener('click',()=>launch('zombie'));
document.getElementById('playPuzzle').addEventListener('click',()=>launch('puzzle'));
document.getElementById('back').addEventListener('click',goHome);
document.getElementById('fullscreen').addEventListener('click',toggleFullscreen);
</script>
</body>
</html>
